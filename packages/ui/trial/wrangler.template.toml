# Deploy config template for trial/bundle deployments.
#
# Consumed by the firela-trial service (and any bundle-based deployer):
# resolve PLACEHOLDER_D1_ID / PLACEHOLDER_KV_ID to freshly created
# resources on the target (temporary) account and write the result as
# wrangler.toml next to this file before running `wrangler deploy`.
#
# The worker is the pre-bundled ESM module produced by
# `wrangler deploy --dry-run --outdir=worker-bundle` — the [alias]
# shims are already inlined, so no alias section is needed here.
name = "firela-bot"
main = "worker-bundle/index.js"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat_v2"]
workers_dev = true

[assets]
directory = "dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
# Worker-first ONLY for the paths the Worker owns; every other path is served
# by assets directly. WARNING: with an array, NON-matching paths NEVER reach
# the Worker (assets-only — no fallback to Worker), so this list must cover
# every public mount. "/" is here for the first-run bootstrap surface
# (issue #21, routes/bootstrap.ts); new top-level mounts MUST be added here
# AND in ../../wrangler.toml (kept in sync by hand — see ADR-009 D-C).
run_worker_first = ["/", "/health", "/api/*", "/auth/*", "/webhook/*"]

[[d1_databases]]
binding = "DB"
database_name = "firela-bot-data"
database_id = "PLACEHOLDER_D1_ID"

[[kv_namespaces]]
binding = "CONFIG"
id = "PLACEHOLDER_KV_ID"
