name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 ships npm 11 (>= 11.5.1 required for npm trusted publishing /
      # OIDC auth). No NPM_TOKEN and no registry input (npm defaults to
      # registry.npmjs.org; the registry input would write a stale
      # _authToken=${NODE_AUTH_TOKEN} line into ~/.npmrc).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Pinned to a commit SHA: mutable tag hijack on a supply-chain-critical
      # workflow is the AsyncAPI-style OIDC attack vector.
      - name: Setup pnpm
        uses: pnpm/action-setup@53751a9789c7351e4924f01fe68370252a4f1f18 # v2.4.1
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      # Single npm publishing face (version.yml no longer publishes; a tag is
      # the release moment). pnpm only PACKS (workspace: protocol resolution);
      # the actual registry publish goes through the npm CLI, whose OIDC
      # trusted-publishing support is reliable (pnpm publish + OIDC is not -
      # pnpm/pnpm#9812).
      - name: Publish packages
        run: |
          for package in packages/runtime-adapters packages/billclaw/core packages/billclaw/cli; do
            if [ -f "$package/package.json" ]; then
              cd "$package"
              PACKAGE_NAME=$(node -p "require('./package.json').name")
              PACKAGE_VERSION=$(node -p "require('./package.json').version")
              PACK_DIR="$RUNNER_TEMP/packs/$package"
              mkdir -p "$PACK_DIR"

              # Check if package version is already published
              echo "Checking if $PACKAGE_NAME@$PACKAGE_VERSION is already published..."
              if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" > /dev/null 2>&1; then
                echo "✓ $PACKAGE_NAME@$PACKAGE_VERSION is already published, skipping..."
              else
                echo "Publishing $PACKAGE_NAME@$PACKAGE_VERSION..."
                pnpm pack --pack-destination "$PACK_DIR"
                npm publish "$PACK_DIR"/*.tgz --access public
              fi
              cd ../..
            fi
          done
