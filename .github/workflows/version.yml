name: Version Packages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "billclaw-docs/**"
      - ".claude/**"
      - "CLAUDE.md"
      - "README.md"
      - "CHANGELOG.md"
      - ".changeset/README.md"
      - ".gitignore"
      - ".gitmodules"
      # Note: .changeset/*.md files (except README) will trigger this workflow
  workflow_dispatch:

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Create Version PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Mint a release-app token up front: both the changesets version PR and
      # (on qualifying release merges) the tag push below must run under the
      # app identity. PRs created with GITHUB_TOKEN leave their CI/E2E runs in
      # action_required - one manual approval per run, which blocks every
      # release (#56).
      # NOTE: singular permission-* inputs only; create-github-app-token
      # v2.2.2 silently ignores a plural `permissions:` input.
      - name: Check release app
        id: appcfg
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
        run: |
          if [ -n "$RELEASE_APP_ID" ]; then echo "has_app=true" >> "$GITHUB_OUTPUT"; else echo "has_app=false" >> "$GITHUB_OUTPUT"; fi

      - name: Create release app token
        if: steps.appcfg.outputs.has_app == 'true'
        id: app-token
        # Mint failure falls back to github.token below instead of blocking
        # the version PR; the annotation step below keeps that loud.
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # The run stays green on fallback, so make the no-op visible: a mint
      # failure means PRs go out as GITHUB_TOKEN again and every CI/E2E run
      # needs manual approval (release skill: Troubleshooting).
      - name: Warn on token fallback
        if: steps.app-token.outcome == 'failure'
        run: echo "::error::release app token mint failed - falling back to GITHUB_TOKEN; PR CI runs will need manual approval again (see release skill troubleshooting)"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Nothing below relies on checkout's persisted credential:
          # changesets authenticates via its own ~/.netrc entry, the tag push
          # uses a one-shot header, and ls-remote here is public-read.
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Pinned to commit SHAs (mutable tag hijack risk on release-adjacent jobs)
      - name: Setup pnpm
        uses: pnpm/action-setup@53751a9789c7351e4924f01fe68370252a4f1f18 # v2.4.1
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Version PR only - publishing is consolidated on the tag-triggered
      # publish.yml (OIDC trusted publishing; a tag is the release moment).
      # The token MUST come via the github-token input, and the env
      # GITHUB_TOKEN line that used to live here is deliberately removed:
      # changesets/action v1.9.0 reads process.env.GITHUB_TOKEN FIRST, so
      # keeping the env would silently pin the action to GITHUB_TOKEN and
      # void the app-identity fix (#56).
      - name: Create Release Pull Request
        uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          version: pnpm version-packages
          commit: "chore: release package versions"
          title: "chore: release package versions"
          github-token: ${{ steps.app-token.outputs.token || github.token }}
        env:
          HUSKY: 0

      # Release moment: cut the tag when the version PR merge lands as a
      # commit whose message starts with the release title. CAVEAT: under
      # `gh pr merge --merge` (the release skill's live path) the head commit
      # is "Merge pull request #N ..." and this gate never fires - the tag is
      # then cut manually per the release skill (#61 tracks fix-vs-delete).
      # The tag triggers publish.yml (npm via OIDC), release-bundle.yml and
      # clawhub-publish.yml.
      #
      # The tag MUST be pushed with a non-GITHUB_TOKEN credential: events
      # created by GITHUB_TOKEN never trigger downstream workflow runs. The
      # release GitHub App fills that role without expiring tokens (App
      # credentials have no 90-day cap, unlike PATs).
      - name: Cut version tag
        if: >-
          github.event_name == 'push' &&
          startsWith(github.event.head_commit.message, 'chore: release package versions') &&
          (steps.appcfg.outputs.has_app != 'true' || steps.app-token.outcome == 'success')
        env:
          HAS_APP: ${{ steps.appcfg.outputs.has_app }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$HAS_APP" != "true" ]; then
            # Bail BEFORE creating a local tag (a stray local tag would collide
            # with the manual cut). Pushing with GITHUB_TOKEN would not trigger
            # the publish/bundle workflows anyway.
            echo "::warning::RELEASE_APP_ID not configured - automated tag cut disabled."
            echo "Cut the tag manually (release skill step): git tag 'v<version>' && git push origin 'v<version>'"
            exit 0
          fi
          # Highest version across the publishable packages: a release that
          # bumps only an independent version line (runtime-adapters, outside
          # the core/cli linked group) must still yield a fresh tag.
          VERSION=$(printf '%s\n' \
            "$(node -p "require('./packages/billclaw/core/package.json').version")" \
            "$(node -p "require('./packages/billclaw/cli/package.json').version")" \
            "$(node -p "require('./packages/runtime-adapters/package.json').version")" \
            | sort -V | tail -1)
          TAG="v$VERSION"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            # Tag taken (same max version again): suffix the short SHA so the
            # release still fires. publish.yml's npm-view check keeps already
            # published versions from double-publishing.
            TAG="$TAG-$(git rev-parse --short HEAD)"
          fi
          git tag "$TAG" "$HEAD_SHA"
          # One-shot credential for this single push: the token appears in no
          # URL, command-line value, or persisted git config (checkout runs
          # with persist-credentials: false). It does sit in ~/.netrc for the
          # rest of the job - the changesets step's git-cli auth entry, which
          # is inherent to changesets/action git-cli mode on an ephemeral
          # runner.
          git -c "http.extraheader=Authorization: Bearer ${APP_TOKEN}" push origin "$TAG"
