name: Update API Types

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual trigger
  repository_dispatch:
    # Triggered by api-specs repo when new version is published
    types: [api-types-updated]

jobs:
  update-types:
    runs-on: ubuntu-latest
    # Least privilege; also pins what the GITHUB_TOKEN fallback path needs
    # (repo default is write today - keep the fallback from silently
    # no-oping if that default ever flips to read-only).
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # PRs created with GITHUB_TOKEN leave their CI/E2E runs in
      # action_required (one manual approval per run) - mint a release-app
      # token so the dependency-bump PR runs its checks unassisted (#56).
      # Singular permission-* inputs only: create-github-app-token v2.2.2
      # silently ignores a plural `permissions:` input.
      - name: Check release app
        id: appcfg
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
        run: |
          if [ -n "$RELEASE_APP_ID" ]; then echo "has_app=true" >> "$GITHUB_OUTPUT"; else echo "has_app=false" >> "$GITHUB_OUTPUT"; fi

      - name: Create release app token
        if: steps.appcfg.outputs.has_app == 'true'
        id: app-token
        # Mint failure falls back to github.token below instead of blocking
        # the daily update; the annotation step keeps that loud.
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write # the labels: input needs the issues API

      - name: Warn on token fallback
        if: steps.app-token.outcome == 'failure'
        run: echo "::error::release app token mint failed - falling back to GITHUB_TOKEN; the PR's CI runs will need manual approval"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check for updates
        id: check
        run: |
          CURRENT=$(jq -r '.dependencies["@firela/api-types"]' packages/billclaw/core/package.json packages/ui/package.json | sort -u | paste -sd, -)
          CANARY=$(npm view @firela/api-types dist-tags.canary)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "canary=$CANARY" >> $GITHUB_OUTPUT
          if [ "$CURRENT" != "$CANARY" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
          fi

      - name: Update @firela/api-types
        if: steps.check.outputs.needs_update == 'true'
        env:
          CANARY: ${{ steps.check.outputs.canary }}
        run: pnpm --filter @firela/billclaw-core --filter @firela/billclaw-ui add "@firela/api-types@$CANARY"

      - name: Build packages
        if: steps.check.outputs.needs_update == 'true'
        run: pnpm build

      - name: Type check
        if: steps.check.outputs.needs_update == 'true'
        run: pnpm -r --filter './packages/**' exec tsc --noEmit

      - name: Create Pull Request
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          commit-message: 'chore: update @firela/api-types to ${{ steps.check.outputs.canary }}'
          title: 'chore: update @firela/api-types to ${{ steps.check.outputs.canary }}'
          body: |
            ## API Types Update

            Updates `@firela/api-types` from `${{ steps.check.outputs.current }}` to `${{ steps.check.outputs.canary }}`.

            ### Changes
            Check the [api-specs releases](https://github.com/fire-la/api-specs/releases) for details.

            ### Verification
            - [x] TypeScript compiles without errors
            - [ ] Manual testing recommended
          branch: update/api-types
          labels: dependencies, automated
